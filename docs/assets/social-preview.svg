<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Agent Oracle: an AI agent orchestration design skill">
  <!-- Source for social-preview.png. Rendered at exactly 1280x640, the size GitHub
       asks for. Type is deliberately oversized: this image is shown at a fraction of
       its width in link previews and repository cards, and has to stay readable there. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1a1533"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="10" fill="#a78bfa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="86" y="196" font-size="92">🔮</text>
    <text x="86" y="310" font-size="82" font-weight="700" fill="#f8fafc">Agent Oracle</text>
    <text x="86" y="386" font-size="38" font-weight="500" fill="#a78bfa">An AI agent orchestration</text>
    <text x="86" y="440" font-size="38" font-weight="500" fill="#a78bfa">design skill for Claude Code</text>
    <text x="86" y="524" font-size="27" fill="#94a3b8">Agent count · topology · loop bounds · harness controls</text>
    <text x="86" y="576" font-size="25" fill="#64748b">github.com/AlveeeRahman/agent-oracle</text>
  </g>
</svg>
